<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.Params.description }}">
  <meta name="theme-color" content="#e8e5e1">
  <meta name="knowledge-base" content="{{ "" | relURL }}">
  <meta name="knowledge-index" content="{{ "knowledge-index.json" | relURL }}">
  <title>{{ site.Title }} · Knowledge OS</title>
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" href="{{ "index.xml" | relURL }}" title="{{ site.Title }}">
  {{- with hugo.Data.knowledge -}}
    {{- range . -}}
      {{- if .isEntry -}}
        {{- range .css }}<link rel="stylesheet" href="{{ printf "knowledge/%s" . | relURL }}">{{ end -}}
        <script type="module" src="{{ printf "knowledge/%s" .file | relURL }}"></script>
      {{- end -}}
    {{- end -}}
  {{- else -}}
    {{- errorf "Knowledge UI is not built. Run pnpm install && pnpm build before Hugo." -}}
  {{- end }}
</head>
<body>
  <main id="viewport"><div id="stage"><p class="initial-status">正在连接知识档案… <a href="{{ "posts/" | relURL }}">浏览文章列表 ↗</a></p></div></main>
  <noscript><p>三维知识库需要 JavaScript。<a href="{{ "posts/" | relURL }}">浏览全部文章</a></p></noscript>
</body>
</html>
