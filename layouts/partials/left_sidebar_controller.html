<script>
(() => {
  const init = () => {
    const shell = document.querySelector('.site-shell');
    const tocPanel = document.querySelector('.post-toc-sidebar');
    const tocToggle = document.querySelector('.post-toc-toggle');
    const compactQuery = window.matchMedia('(max-width: 1023px)');
    const tocStateKey = 'cl_toc_rail_collapsed';

    if (!shell) return;
    shell.classList.toggle('has-no-toc', !tocPanel);

    const safeGet = (key) => {
      try { return localStorage.getItem(key); } catch (_) { return null; }
    };
    const safeSet = (key, value) => {
      try { localStorage.setItem(key, value); } catch (_) {}
    };

    let tocCollapsed = (() => {
      const stored = safeGet(tocStateKey);
      return stored === null ? compactQuery.matches : stored === 'true';
    })();

    const setTocState = (collapsed, persist = true) => {
      if (!tocPanel || !tocToggle) return;
      tocPanel.classList.toggle('is-collapsed', collapsed);
      shell.classList.toggle('is-toc-collapsed', collapsed);
      tocToggle.setAttribute('aria-expanded', String(!collapsed));
      tocToggle.setAttribute('aria-label', `${collapsed ? 'Expand' : 'Collapse'} table of contents`);
      if (persist) safeSet(tocStateKey, String(collapsed));
    };

    tocToggle?.addEventListener('click', () => {
      tocCollapsed = !tocCollapsed;
      setTocState(tocCollapsed);
    });
    setTocState(tocCollapsed, false);

    const setupTocHighlight = () => {
      if (!tocPanel) return;
      const links = Array.from(tocPanel.querySelectorAll('#TableOfContents a[href^="#"]'));
      const entries = links.map((link) => {
        try {
          const heading = document.getElementById(decodeURIComponent(link.hash.slice(1)));
          return heading ? { heading, link } : null;
        } catch (_) {
          return null;
        }
      }).filter(Boolean);
      if (!entries.length) return;

      let activeLink = null;
      let ticking = false;
      const activate = (link) => {
        if (!link || link === activeLink) return;
        links.forEach((item) => {
          item.classList.toggle('is-active', item === link);
          if (item === link) item.setAttribute('aria-current', 'location');
          else item.removeAttribute('aria-current');
        });
        activeLink = link;

        if (!tocPanel.classList.contains('is-collapsed')) {
          const panelRect = tocPanel.getBoundingClientRect();
          const linkRect = link.getBoundingClientRect();
          const headerSpace = 52;
          if (linkRect.top < panelRect.top + headerSpace) {
            tocPanel.scrollTop -= panelRect.top + headerSpace - linkRect.top;
          } else if (linkRect.bottom > panelRect.bottom - 12) {
            tocPanel.scrollTop += linkRect.bottom - panelRect.bottom + 12;
          }
        }
      };

      const update = () => {
        const marker = window.scrollY + Math.min(180, window.innerHeight * 0.28);
        let current = entries[0];
        for (const entry of entries) {
          if (entry.heading.offsetTop <= marker) current = entry;
          else break;
        }
        if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
          current = entries[entries.length - 1];
        }
        activate(current.link);
        ticking = false;
      };

      const requestUpdate = () => {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(update);
      };

      links.forEach((link) => link.addEventListener('click', () => activate(link)));
      window.addEventListener('scroll', requestUpdate, { passive: true });
      window.addEventListener('resize', requestUpdate, { passive: true });
      update();
    };

    const setupColumnTree = () => {
      document.querySelectorAll('.column-index').forEach((tree) => {
        tree.querySelectorAll('.column-index-enter').forEach((link) => {
          link.addEventListener('click', (event) => event.stopPropagation());
        });

        tree.querySelectorAll('[data-column-tree-action]').forEach((button) => {
          button.addEventListener('click', () => {
            const expand = button.dataset.columnTreeAction === 'expand';
            tree.querySelectorAll('details.column-index-branch').forEach((details) => {
              details.open = expand;
            });
          });
        });
      });
    };

    setupTocHighlight();
    setupColumnTree();
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
