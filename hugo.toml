baseURL = "https://caelestis-lumina.github.io/"
locale = "en-US"
title = "Caelestis Lumina"
theme = "PaperMod"
defaultContentLanguage = "en"
hasCJKLanguage = true
enableRobotsTXT = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[taxonomies]
tag = "tags"
column = "columns"

[params]
author = "Caelestis-Lumina"
description = "Notes on programming, artificial intelligence, robotics, and engineering practice."
mainSections = ["posts"]
defaultTheme = "auto"
disableThemeToggle = false
ShowReadingTime = true
ShowCodeCopyButtons = true
ShowToc = true
ShowBreadCrumbs = true
ShowPostNavLinks = true
ShowWordCount = true
DateFormat = "2006-01-02"
ShowRssButtonInSectionTermList = false

[params.homeInfoParams]
Title = "Technical Notes & Engineering Practice"
Content = "Derivations, lessons learned, and practical solutions across programming, AI, robotics, and systems engineering."

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.3
minMatchCharLength = 2
keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "columns"
name = "Columns"
url = "/columns/"
weight = 20

[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 30

[[menu.main]]
identifier = "search"
name = "Search"
url = "/search/"
weight = 40

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 50

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\\[', '\\]']]
          inline = [['$', '$'], ['\\(', '\\)']]
