baseURL = "https://caelestis-lumina.github.io/"
locale = "en-US"
title = "Caelestis Lumina"
theme = "PaperMod"
defaultContentLanguage = "en"
hasCJKLanguage = true
enableRobotsTXT = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[taxonomies]
tag = "tags"
column = "columns"

[params]
author = "Caelestis-Lumina"
description = "Notes on programming, artificial intelligence, robotics, and engineering practice."
mainSections = ["posts"]
defaultTheme = "auto"
disableThemeToggle = false
ShowReadingTime = true
ShowCodeCopyButtons = true
ShowToc = true
ShowBreadCrumbs = true
ShowPostNavLinks = true
ShowWordCount = true
DateFormat = "2006-01-02"
ShowRssButtonInSectionTermList = false

[params.assets]
favicon = "/favicon.svg"
favicon16x16 = "/favicon.svg"
favicon32x32 = "/favicon.svg"
apple_touch_icon = "/favicon.svg"
safari_pinned_tab = "/favicon.svg"
theme_color = "#111318"
msapplication_TileColor = "#111318"

[params.giscus]
enabled = true
repo = "Caelestis-Lumina/Caelestis-Lumina.github.io"
repoId = "R_kgDOQn6aDg"
category = "General"
categoryId = "DIC_kwDOQn6aDs4DEeFv"
mapping = "pathname"
strict = "0"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "top"
lang = "en"
loading = "lazy"

[params.homeInfoParams]
Title = "Technical Notes & Engineering Practice"
Content = "Derivations, lessons learned, and practical solutions across programming, AI, robotics, and systems engineering."

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.3
minMatchCharLength = 2
keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "columns"
name = "Columns"
url = "/columns/"
weight = 20

[[menu.main]]
identifier = "tags"
name = "Tags"
url = "/tags/"
weight = 30

[[menu.main]]
identifier = "search"
name = "Search"
url = "/search/"
weight = 40

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 50

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\\[', '\\]']]
          inline = [['$', '$'], ['\\(', '\\)']]
