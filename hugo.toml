baseURL = "https://caelestis-lumina.github.io/"
languageCode = "zh-cn"
title = "Caelestis Lumina"
theme = "PaperMod"
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableRobotsTXT = true

[outputs]
home = ["HTML", "RSS", "JSON"]

[taxonomies]
tag = "tags"
column = "columns"

[params]
author = "Caelestis-Lumina"
description = "分享编程语言、人工智能、机器人等相关技术栈"
mainSections = ["posts"]
defaultTheme = "auto"
disableThemeToggle = false
ShowReadingTime = true
ShowCodeCopyButtons = true
ShowToc = true
ShowBreadCrumbs = true
ShowPostNavLinks = true
ShowWordCount = true
DateFormat = "2006-01-02"
ShowRssButtonInSectionTermList = true

[params.homeInfoParams]
Title = "技术笔记与工程实践"
Content = "记录编程、人工智能、机器人与工程实践中的推导、踩坑和解决方案。"

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.3
minMatchCharLength = 2
keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
identifier = "posts"
name = "文章"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "columns"
name = "专栏"
url = "/columns/"
weight = 20

[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 30

[[menu.main]]
identifier = "search"
name = "搜索"
url = "/search/"
weight = 40

[[menu.main]]
identifier = "about"
name = "关于"
url = "/about/"
weight = 50

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\\[', '\\]']]
          inline = [['$', '$'], ['\\(', '\\)']]
